# Rendered from modules/theme; @name@ tokens are theme values.

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 3, soft
    animation = inputFieldColors, 1, 5, soft
    animation = inputFieldWidth, 1, 4, soft
}

# The desktop itself, frosted and dimmed.
background {
    monitor =
    path = screenshot
    color = rgb(@crust@)
    blur_size = @lockBlurSize@
    blur_passes = @lockBlurPasses@
    brightness = @lockBrightness@
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.01
}

# Clock
label {
    monitor =
    text = $TIME
    font_family = Noto Sans Thin
    font_size = 120
    color = rgba(@text@f2)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(@crust@66)
    position = 0, 170
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    font_family = Noto Sans Light
    font_size = 17
    color = rgba(@muted@e6)
    position = 0, 65
    halign = center
    valign = center
}

# A short accent rule between the date and the password field.
shape {
    monitor =
    size = 36, 2
    rounding = 1
    color = rgba(@accent@cc)
    border_size = 0
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(@text@26)
    inner_color = rgba(@base@@opacityHex@)
    font_color = rgb(@text@)
    font_family = Noto Sans
    check_color = rgba(@accent@ff)
    fail_color = rgba(@red@ff)
    capslock_color = rgba(@yellow@ff)
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##@muted@">Password</span>
    fail_text = <span foreground="##@red@">$FAIL</span>
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(@crust@55)
    position = 0, -50
    halign = center
    valign = center
}

# Keyboard layout: the password may be typed in Persian by accident.
label {
    monitor =
    text = 󰌌  $LAYOUT
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    color = rgba(@muted@b3)
    position = 0, 40
    halign = center
    valign = bottom
}
