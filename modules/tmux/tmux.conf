# WezTerm's default TERM is xterm-256color; it supports full RGB colors.
# Preserve tmux's other detected features and its tmux-256color pane TERM.
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"

# Make the status line pretty and add modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Close window 2 of 1 2 3 and the others become 1 2, never 1 3.
set -g renumber-windows on

# Alt+1..9 jumps straight to that window, no prefix. Windows always run 1..n,
# so a number past the last window is ignored instead of raising an error.
bind -n M-1 if-shell -F '#{e|<=:1,#{session_windows}}' 'select-window -t :=1'
bind -n M-2 if-shell -F '#{e|<=:2,#{session_windows}}' 'select-window -t :=2'
bind -n M-3 if-shell -F '#{e|<=:3,#{session_windows}}' 'select-window -t :=3'
bind -n M-4 if-shell -F '#{e|<=:4,#{session_windows}}' 'select-window -t :=4'
bind -n M-5 if-shell -F '#{e|<=:5,#{session_windows}}' 'select-window -t :=5'
bind -n M-6 if-shell -F '#{e|<=:6,#{session_windows}}' 'select-window -t :=6'
bind -n M-7 if-shell -F '#{e|<=:7,#{session_windows}}' 'select-window -t :=7'
bind -n M-8 if-shell -F '#{e|<=:8,#{session_windows}}' 'select-window -t :=8'
bind -n M-9 if-shell -F '#{e|<=:9,#{session_windows}}' 'select-window -t :=9'
