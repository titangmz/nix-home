# WezTerm's default TERM is xterm-256color; it supports full RGB colors.
# Preserve tmux's other detected features and its tmux-256color pane TERM.
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"

# Make the status line pretty and add modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Make status bar background transparent
set -g status-style "bg=default"

unbind C-b
set -g prefix C-a
bind C-a send-prefix
